##### Environment
logging.level.org.springframework.boot.context.config=DEBUG
spring.application.name=manager-application
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.profiles.include=mail
server.port=${PORT:8080}

##### Service discovery
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.healthcheck.enabled=true
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
eureka.instance.health-check-url-path=${server.servlet.contextPath}/actuator/health
eureka.instance.status-page-url-path=${server.servlet.contextPath}/actuator/info

##### Database configuration
spring.liquibase.change-log=classpath:/changelog/db.changelog-master.xml

##### Swagger
spring.mvc.pathmatch.matching-strategy= ANT_PATH_MATCHER

##### Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID:manager-application}
manager.kafka.topics.shipment-return-created=${SHIPMENT_RETURN_CREATED_TOPIC:shipment.return.created}
manager.kafka.topics.shipment-return-canceled=${SHIPMENT_RETURN_CANCELED_TOPIC:shipment.return.canceled}
manager.kafka.topics.shipment-events=${SHIPMENT_EVENTS_TOPIC:shipment.events}
manager.kafka.integration-events.routes.shipment.status.changed=${manager.kafka.topics.shipment-events}
manager.kafka.integration-events.routes.shipment.changed=${manager.kafka.topics.shipment-events}
manager.kafka.integration-events.routes.shipment.created=${manager.kafka.topics.shipment-events}
manager.kafka.integration-events.routes.shipment.destination.changed=${manager.kafka.topics.shipment-events}
manager.kafka.integration-events.routes.shipment.return.created=${manager.kafka.topics.shipment-return-created}
manager.kafka.integration-events.routes.shipment.return.canceled=${manager.kafka.topics.shipment-return-canceled}
manager.kafka.topics.shipment-read-model-sync=${SHIPMENT_READ_MODEL_SYNC_TOPIC:shipment.read-model.sync}
manager.kafka.integration-events.routes.shipment.read-model.changed=${manager.kafka.topics.shipment-read-model-sync}
manager.kafka.topics.operator-configuration-create=${OPERATOR_CONFIGURATION_CREATE_TOPIC:operator.configuration.create}
manager.kafka.topics.department-user-events=${DEPARTMENT_USER_EVENTS_TOPIC:department.user.events}
manager.kafka.topics.department-status-events=${DEPARTMENT_STATUS_EVENTS_TOPIC:department.status.events}
manager.kafka.integration-events.routes.department.status.changed=${manager.kafka.topics.department-status-events}
manager.kafka.integration-events.routes.department.user.changed=${manager.kafka.topics.department-user-events}
manager.kafka.consumer-groups.shipment-read-model-sync=${SHIPMENT_READ_MODEL_SYNC_GROUP_ID:manager-shipment-read-model}
manager.kafka.consumer-groups.operator-configuration-create=${OPERATOR_CONFIGURATION_CREATE_GROUP_ID:manager-operator-configuration-create}
manager.kafka.consumer-groups.department-user-events=${DEPARTMENT_USER_EVENTS_GROUP_ID:manager-auth-department-users}
manager.kafka.consumer-groups.delivery-network-department-status=${DELIVERY_NETWORK_DEPARTMENT_STATUS_GROUP_ID:manager-delivery-network-department-status}
manager.kafka.outbox.enabled=${MANAGER_KAFKA_OUTBOX_ENABLED:${MANAGER_KAFKA_DOMAIN_EVENTS_ENABLED:true}}
manager.kafka.integration-events.enabled=${MANAGER_KAFKA_INTEGRATION_EVENTS_ENABLED:${MANAGER_KAFKA_DOMAIN_EVENTS_ENABLED:true}}
manager.kafka.shipment-read-model-sync.enabled=${MANAGER_KAFKA_SHIPMENT_READ_MODEL_SYNC_ENABLED:${MANAGER_KAFKA_DOMAIN_EVENTS_ENABLED:true}}
manager.kafka.consumer.retry.max-attempts=${MANAGER_KAFKA_CONSUMER_RETRY_MAX_ATTEMPTS:3}
manager.kafka.consumer.retry.backoff-ms=${MANAGER_KAFKA_CONSUMER_RETRY_BACKOFF_MS:1000}
manager.kafka.consumer.dlt-suffix=${MANAGER_KAFKA_CONSUMER_DLT_SUFFIX:.DLT}
manager.kafka.consumer.dlt.publish-timeout-ms=${MANAGER_KAFKA_CONSUMER_DLT_PUBLISH_TIMEOUT_MS:10000}
manager.kafka.outbox.lock-duration-ms=${MANAGER_KAFKA_OUTBOX_LOCK_DURATION_MS:30000}
manager.kafka.outbox.retry-delay-ms=${MANAGER_KAFKA_OUTBOX_RETRY_DELAY_MS:5000}
manager.kafka.outbox.max-attempts=${MANAGER_KAFKA_OUTBOX_MAX_ATTEMPTS:10}

##### Global prefix endpoint
server.servlet.contextPath=/v2/api

##### API exposure
api.exposure.internal-prefix=/internal
api.exposure.internal-controller-paths[0]=/device-pairings
api.exposure.internal-controller-paths[1]=/device-pairing-verifications
api.exposure.internal-controller-paths[2]=/shipments/read-sync
api.exposure.pair-key-controller-paths[0]=/device-pairing-verifications
api.exposure.public-endpoints[0].method=POST
api.exposure.public-endpoints[0].path=/device-pairings

purge.cron.expression= @midnight

##### Browser authentication
jwt.issuer=${JWT_ISSUER:manager-v2}
jwt.audience=${JWT_AUDIENCE:manager-v2-gui}
auth.cookie.access-name=${AUTH_ACCESS_COOKIE_NAME:AUTH-TOKEN}
auth.cookie.refresh-name=${AUTH_REFRESH_COOKIE_NAME:REFRESH-TOKEN}
auth.cookie.access-path=${AUTH_ACCESS_COOKIE_PATH:/}
auth.cookie.refresh-path=${AUTH_REFRESH_COOKIE_PATH:/v2/api/auth}
auth.cookie.domain=${AUTH_COOKIE_DOMAIN:}
auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Secure}
auth.cors.allowed-origins=${AUTH_CORS_ALLOWED_ORIGINS:http://localhost:3000,https://managerv2gui.onrender.com}
auth.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
auth.cors.allowed-headers=Content-Type,X-XSRF-TOKEN,X-Correlation-ID,X-Requested-With
auth.cors.exposed-headers=X-Correlation-ID
auth.cors.max-age-seconds=3600

##### Credential encryption
credentials.encryption-key=${CREDENTIALS_ENCRYPTION_KEY:}

##### InPost Global Tracking
tracking.inpost.connect-timeout=${INPOST_CONNECT_TIMEOUT:3s}
tracking.inpost.read-timeout=${INPOST_READ_TIMEOUT:8s}
tracking.inpost.retry.max-attempts=${INPOST_RETRY_MAX_ATTEMPTS:3}
tracking.inpost.retry.initial-delay=${INPOST_RETRY_INITIAL_DELAY:200ms}
tracking.inpost.retry.max-delay=${INPOST_RETRY_MAX_DELAY:2s}
