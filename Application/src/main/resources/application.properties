##### Environment
logging.level.org.springframework.boot.context.config=DEBUG
spring.application.name=manager-application
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.profiles.include=mail
server.port=${PORT:8080}

##### Service discovery
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.healthcheck.enabled=true
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
eureka.instance.health-check-url-path=${server.servlet.contextPath}/actuator/health
eureka.instance.status-page-url-path=${server.servlet.contextPath}/actuator/info

##### Database configuration
spring.liquibase.change-log=classpath:/changelog/db.changelog-master.xml

##### Swagger
spring.mvc.pathmatch.matching-strategy= ANT_PATH_MATCHER

##### Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID:manager-application}
manager.kafka.topics.return-package-status-changed=${RETURN_PACKAGE_STATUS_CHANGED_TOPIC:return.package.status.changed}
manager.kafka.topics.shipment-events=${SHIPMENT_EVENTS_TOPIC:shipment.events}
manager.kafka.topics.shipment-created=${SHIPMENT_CREATED_TOPIC:shipment.created}
manager.kafka.topics.shipment-delivered=${SHIPMENT_DELIVERED_TOPIC:shipment.delivered}
manager.kafka.integration-events.routes.shipment.status.changed=${manager.kafka.topics.shipment-events}
manager.kafka.integration-events.routes.shipment.changed=${manager.kafka.topics.shipment-events}
manager.kafka.integration-events.routes.shipment.created=${manager.kafka.topics.shipment-created}
manager.kafka.topics.shipment-canceled=${SHIPMENT_CANCELED_TOPIC:shipment.canceled}
manager.kafka.integration-events.routes.shipment.canceled=${manager.kafka.topics.shipment-canceled}
manager.kafka.topics.delivery-events=${DELIVERY_EVENTS_TOPIC:delivery.events}
manager.kafka.integration-events.routes.delivery.created=${manager.kafka.topics.delivery-events}
manager.kafka.integration-events.routes.delivery.modified=${manager.kafka.topics.delivery-events}
manager.kafka.integration-events.routes.delivery.attempt-recorded=${manager.kafka.topics.delivery-events}
manager.kafka.integration-events.routes.delivery.completed=${manager.kafka.topics.delivery-events}
manager.kafka.integration-events.routes.delivery.canceled=${manager.kafka.topics.delivery-events}
logistics.delivery.attempt-limit=${DELIVERY_ATTEMPT_LIMIT:3}
manager.kafka.integration-events.routes.shipment.delivered=${manager.kafka.topics.shipment-delivered}
manager.kafka.topics.shipment-out-for-delivery=${SHIPMENT_OUT_FOR_DELIVERY_TOPIC:shipment.out-for-delivery}
manager.kafka.integration-events.routes.shipment.out-for-delivery=${manager.kafka.topics.shipment-out-for-delivery}
manager.kafka.integration-events.routes.shipment.destination.changed=${manager.kafka.topics.shipment-events}
manager.kafka.integration-events.routes.return.package.status.changed=${manager.kafka.topics.return-package-status-changed}
manager.kafka.topics.shipment-reroute-requested=${SHIPMENT_REROUTE_REQUESTED_TOPIC:shipment.reroute.requested}
manager.kafka.integration-events.routes.shipment.reroute.requested=${manager.kafka.topics.shipment-reroute-requested}
manager.kafka.topics.return-shipment-delivered=${RETURN_SHIPMENT_DELIVERED_TOPIC:return.shipment.delivered}
manager.kafka.integration-events.routes.return.shipment.delivered=${manager.kafka.topics.return-shipment-delivered}
manager.kafka.topics.return-processing=${RETURN_PROCESSING_TOPIC:return.processing.started}
manager.kafka.topics.shipment-read-model-sync=${SHIPMENT_READ_MODEL_SYNC_TOPIC:shipment.read-model.sync}
manager.kafka.integration-events.routes.shipment.read-model.changed=${manager.kafka.topics.shipment-read-model-sync}
manager.kafka.topics.pickup-point-read-model-sync=${PICKUP_POINT_READ_MODEL_SYNC_TOPIC:pickup-point.read-model.sync}
manager.kafka.integration-events.routes.pickup-point.read-model.changed=${manager.kafka.topics.pickup-point-read-model-sync}
manager.kafka.topics.operator-configuration-create=${OPERATOR_CONFIGURATION_CREATE_TOPIC:operator.configuration.create}
manager.kafka.topics.department-user-events=${DEPARTMENT_USER_EVENTS_TOPIC:department.user.events}
manager.kafka.topics.department-status-events=${DEPARTMENT_STATUS_EVENTS_TOPIC:department.status.events}
manager.kafka.integration-events.routes.department.status.changed=${manager.kafka.topics.department-status-events}
manager.kafka.integration-events.routes.department.user.changed=${manager.kafka.topics.department-user-events}
manager.kafka.topics.user-invitation-issued=${USER_INVITATION_ISSUED_TOPIC:user.invitation.issued}
manager.kafka.integration-events.routes.user.invitation.issued=${manager.kafka.topics.user-invitation-issued}
manager.kafka.topics.supplier-driver-license-invalidated=${SUPPLIER_DRIVER_LICENSE_INVALIDATED_TOPIC:supplier.driver-license.invalidated}
manager.kafka.integration-events.routes.supplier.driver-license.invalidated=${manager.kafka.topics.supplier-driver-license-invalidated}
manager.kafka.topics.pallet-loaded=${PALLET_LOADED_TOPIC:pallet.loaded}
manager.kafka.integration-events.routes.pallet.loaded=${manager.kafka.topics.pallet-loaded}
manager.kafka.consumer-groups.pallet-loaded-delivery=${PALLET_LOADED_DELIVERY_GROUP_ID:logistics-orchestrator-pallet}
manager.kafka.consumer-groups.pickup-point-read-model-sync=${PICKUP_POINT_READ_MODEL_SYNC_GROUP_ID:manager-pickup-point-read-model}
manager.kafka.consumer-groups.operator-configuration-create=${OPERATOR_CONFIGURATION_CREATE_GROUP_ID:manager-operator-configuration-create}
manager.kafka.consumer-groups.operator-subscription-create=${OPERATOR_SUBSCRIPTION_CREATE_GROUP_ID:manager-operator-subscription-create}
manager.kafka.consumer-groups.department-user-events=${DEPARTMENT_USER_EVENTS_GROUP_ID:manager-auth-department-users}
manager.kafka.consumer-groups.delivery-network-department-status=${DELIVERY_NETWORK_DEPARTMENT_STATUS_GROUP_ID:manager-delivery-network-department-status}
manager.kafka.consumer-groups.shipment-reroute-requested=${SHIPMENT_REROUTE_REQUESTED_GROUP_ID:manager-shipment-reroute}
manager.kafka.outbox.enabled=${MANAGER_KAFKA_OUTBOX_ENABLED:${MANAGER_KAFKA_DOMAIN_EVENTS_ENABLED:true}}
manager.kafka.integration-events.enabled=${MANAGER_KAFKA_INTEGRATION_EVENTS_ENABLED:${MANAGER_KAFKA_DOMAIN_EVENTS_ENABLED:true}}
manager.kafka.pickup-point-read-model-sync.enabled=${MANAGER_KAFKA_PICKUP_POINT_READ_MODEL_SYNC_ENABLED:${MANAGER_KAFKA_DOMAIN_EVENTS_ENABLED:true}}
manager.kafka.consumer.retry.max-attempts=${MANAGER_KAFKA_CONSUMER_RETRY_MAX_ATTEMPTS:3}
manager.kafka.consumer.retry.backoff-ms=${MANAGER_KAFKA_CONSUMER_RETRY_BACKOFF_MS:1000}
manager.kafka.consumer.dlt-suffix=${MANAGER_KAFKA_CONSUMER_DLT_SUFFIX:.DLT}
manager.kafka.consumer.dlt.publish-timeout-ms=${MANAGER_KAFKA_CONSUMER_DLT_PUBLISH_TIMEOUT_MS:10000}
manager.kafka.outbox.lock-duration-ms=${MANAGER_KAFKA_OUTBOX_LOCK_DURATION_MS:30000}
manager.kafka.outbox.retry-delay-ms=${MANAGER_KAFKA_OUTBOX_RETRY_DELAY_MS:5000}
manager.kafka.outbox.max-attempts=${MANAGER_KAFKA_OUTBOX_MAX_ATTEMPTS:10}

##### Pallet Handling Manager
pallet-handling-manager.url=${PALLET_HANDLING_MANAGER_URL:http://localhost:8071}
pallet-handling-manager.connect-timeout=${PALLET_HANDLING_MANAGER_CONNECT_TIMEOUT:1s}
pallet-handling-manager.read-timeout=${PALLET_HANDLING_MANAGER_READ_TIMEOUT:3s}
pallet-handling-manager.wait-duration-in-open-state=${PALLET_HANDLING_MANAGER_CB_OPEN_DURATION:30s}

##### Global prefix endpoint
server.servlet.contextPath=/v1/api

##### API exposure
api.exposure.internal-prefix=/internal
api.exposure.internal-controller-paths[0]=/device-activations
api.exposure.internal-controller-paths[1]=/device-pairing-verifications
api.exposure.internal-controller-paths[2]=/shipments/read-sync
api.exposure.pair-key-controller-paths[0]=/device-pairing-verifications
api.exposure.mcp-paths[0]=/mcp
api.exposure.public-endpoints[0].method=POST
api.exposure.public-endpoints[0].path=/device-activations

##### Device activation
device.activation.code-validity=${DEVICE_ACTIVATION_CODE_VALIDITY:PT15M}
device.activation.pair-key-validity=${DEVICE_ACTIVATION_PAIR_KEY_VALIDITY:P180D}
device.operator-session.validity=${DEVICE_OPERATOR_SESSION_VALIDITY:PT12H}

##### MCP server
spring.ai.mcp.server.enabled=${MCP_SERVER_ENABLED:true}
spring.ai.mcp.server.name=manager
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STATELESS
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
spring.ai.mcp.server.capabilities.tool=true
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.completion=false
spring.ai.mcp.server.instructions=Read-only access to the Manager logistics system of the caller's operator. Personal data of senders and recipients is masked.

purge.cron.expression=0 0 0,12 * * *

##### Supplier user invitation
manager.auth.invitation.url=${AUTH_INVITATION_URL:http://localhost:3000/set-password}
manager.auth.invitation.validity=${AUTH_INVITATION_VALIDITY:PT72H}
manager.auth.invitation.language=${AUTH_INVITATION_LANGUAGE:pl}

##### Shipment reroute (public shipment edit by the client)
reroute.shipment-edit-url=${REROUTE_SHIPMENT_EDIT_URL:http://localhost:3000/shipment-edit}
reroute.token-validity=${REROUTE_TOKEN_VALIDITY:PT30M}
reroute.max-failed-attempts=${REROUTE_MAX_FAILED_ATTEMPTS:5}

##### Browser authentication
jwt.issuer=${JWT_ISSUER:manager-v2}
jwt.audience=${JWT_AUDIENCE:manager-v2-gui}
auth.cookie.access-name=${AUTH_ACCESS_COOKIE_NAME:AUTH-TOKEN}
auth.cookie.refresh-name=${AUTH_REFRESH_COOKIE_NAME:REFRESH-TOKEN}
auth.cookie.platform-owner-access-name=${AUTH_PLATFORM_OWNER_ACCESS_COOKIE_NAME:PLATFORM-AUTH-TOKEN}
auth.cookie.platform-owner-refresh-name=${AUTH_PLATFORM_OWNER_REFRESH_COOKIE_NAME:PLATFORM-REFRESH-TOKEN}
auth.cookie.platform-owner-refresh-path=${AUTH_PLATFORM_OWNER_REFRESH_COOKIE_PATH:/v1/api/platform/auth}
auth.cookie.access-path=${AUTH_ACCESS_COOKIE_PATH:/}
auth.cookie.refresh-path=${AUTH_REFRESH_COOKIE_PATH:/v1/api/auth}
auth.cookie.domain=${AUTH_COOKIE_DOMAIN:}
auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
auth.cors.allowed-origins=${AUTH_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081,https://app.managerv2.net}
auth.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
auth.cors.allowed-headers=Content-Type,X-XSRF-TOKEN,X-Correlation-ID,X-Requested-With,SOAPAction
auth.cors.exposed-headers=X-Correlation-ID
auth.cors.max-age-seconds=3600
auth.cookie.secure=${AUTH_COOKIE_SECURE:true}

##### Credential encryption
credentials.encryption-key=${CREDENTIALS_ENCRYPTION_KEY:}

##### InPost Global Tracking
tracking.inpost.connect-timeout=${INPOST_CONNECT_TIMEOUT:3s}
tracking.inpost.read-timeout=${INPOST_READ_TIMEOUT:8s}
tracking.inpost.retry.max-attempts=${INPOST_RETRY_MAX_ATTEMPTS:3}
tracking.inpost.retry.initial-delay=${INPOST_RETRY_INITIAL_DELAY:200ms}
tracking.inpost.retry.max-delay=${INPOST_RETRY_MAX_DELAY:2s}

manager.kafka.topics.return-cancelled=${RETURN_CANCELLED_TOPIC:return.cancelled}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
