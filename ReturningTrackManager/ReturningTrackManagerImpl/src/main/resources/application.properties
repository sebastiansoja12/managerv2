spring.application.name=returning-track-manager
##### Environment
logging.level.org.springframework.boot.context.config=DEBUG
spring.profiles.include=dev, mail

##### Service discovery
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.healthcheck.enabled=true
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
eureka.instance.health-check-url-path=${server.servlet.contextPath}/actuator/health
eureka.instance.status-page-url-path=${server.servlet.contextPath}/actuator/info

##### Database configuration
spring.jpa.show-sql=true
spring.liquibase.enabled=${SPRING_LIQUIBASE_ENABLED:true}
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml

##### Swagger
spring.mvc.pathmatch.matching-strategy= ANT_PATH_MATCHER

##### Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID:returning-track-manager}
spring.kafka.consumer.auto-offset-reset=earliest
manager.kafka.topics.shipment-events=${SHIPMENT_EVENTS_TOPIC:shipment.events}

##### Global prefix endpoint
server.servlet.contextPath=/v1/api

purge.cron.expression= @midnight

server.port=8070

##### Integration event outbox
spring.kafka.producer.properties.max.block.ms=10000
spring.kafka.producer.properties.delivery.timeout.ms=30000
spring.kafka.producer.properties.request.timeout.ms=10000
manager.events.outbox.enabled=true
manager.events.outbox.relay.enabled=${MANAGER_EVENTS_OUTBOX_RELAY_ENABLED:true}
manager.events.outbox.legacy-envelope=true

spring.jackson.use-jackson2-defaults=true

##### OpenAPI (internal service, not documented)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

##### JWT validation (must match the issuer and audience of the manager application)
jwt.issuer=${JWT_ISSUER:manager-v2}
jwt.audience=${JWT_AUDIENCE:manager-v2-gui}

##### Tracing
management.tracing.sampling.probability=${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
management.otlp.metrics.export.enabled=false
management.logging.export.otlp.enabled=false
spring.kafka.listener.observation-enabled=true
