spring.application.name=returning-track-manager
##### Environment
logging.level.org.springframework.boot.context.config=DEBUG
spring.profiles.include=dev, mail

##### Service discovery
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.healthcheck.enabled=true
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
eureka.instance.health-check-url-path=${server.servlet.contextPath}/actuator/health
eureka.instance.status-page-url-path=${server.servlet.contextPath}/actuator/info

##### Database configuration
spring.jpa.show-sql=true
spring.liquibase.enabled=${SPRING_LIQUIBASE_ENABLED:true}
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml

##### Swagger
spring.mvc.pathmatch.matching-strategy= ANT_PATH_MATCHER

##### Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID:returning-track-manager}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
manager.kafka.topics.shipment-events=${SHIPMENT_EVENTS_TOPIC:shipment.events}
manager.kafka.topics.shipment-return-created=${SHIPMENT_RETURN_CREATED_TOPIC:shipment.return.created}
manager.kafka.topics.shipment-return-canceled=${SHIPMENT_RETURN_CANCELED_TOPIC:shipment.return.canceled}

##### Global prefix endpoint
server.servlet.contextPath=/v2/api

purge.cron.expression= @midnight

server.port=8070

##### RTM outbox
manager.kafka.integration-events.routes.return.processing.started=return.processing.started
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=10000
spring.kafka.producer.properties.delivery.timeout.ms=30000
spring.kafka.producer.properties.request.timeout.ms=10000
returning.outbox.publish-delay-ms=5000
returning.outbox.batch-size=50
returning.outbox.lock-duration-ms=60000
returning.outbox.send-timeout-ms=10000
returning.outbox.retry-delay-ms=5000
returning.outbox.max-attempts=10

manager.kafka.integration-events.routes.return.cancelled=${RETURN_CANCELLED_TOPIC:return.cancelled}
