spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=${MAIL_PROTOCOL:smtp}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT_MS:10000}

manager.mail.enabled=${MAIL_ENABLED:false}
manager.mail.from.address=${MAIL_FROM_ADDRESS:no-reply@manager.local}
manager.mail.from.name=${MAIL_FROM_NAME:Manager}
manager.mail.default-locale=${MAIL_DEFAULT_LOCALE:pl}
manager.mail.unmapped-country-locale=${MAIL_UNMAPPED_COUNTRY_LOCALE:en}
manager.mail.country-locales=${MAIL_COUNTRY_LOCALES:PL:pl,DE:de,AT:de,CH:de,LI:de,GB:en,IE:en,US:en}
manager.mail.links.tracking-url=${MAIL_TRACKING_URL:}
manager.mail.links.shipment-edit-url=${MAIL_SHIPMENT_EDIT_URL:${reroute.shipment-edit-url:}}
