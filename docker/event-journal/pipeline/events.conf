# Central event journal: every Kafka topic of every service (integration events, outbox.dead, *.DLT) is indexed
# into Elasticsearch with its headers, so events can be searched in one place in Kibana
# (data view "manager-events-*") and joined with Jaeger through trace.id.
input {
  kafka {
    bootstrap_servers => "${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}"
    topics_pattern => "^(?!_|connect-).*"
    metadata_max_age_ms => 30000
    group_id => "event-journal"
    client_id => "event-journal"
    auto_offset_reset => "earliest"
    decorate_events => "extended"
    codec => plain { charset => "UTF-8" }
  }
}

filter {
  mutate {
    copy => {
      "[@metadata][kafka][topic]" => "[kafka][topic]"
      "[@metadata][kafka][partition]" => "[kafka][partition]"
      "[@metadata][kafka][offset]" => "[kafka][offset]"
      "[@metadata][kafka][key]" => "[kafka][key]"
      "[@metadata][kafka][headers]" => "[headers]"
    }
  }

  json {
    source => "message"
    target => "payload"
    skip_on_invalid_json => true
  }

  # CloudEvents headers first, legacy envelope headers as fallback.
  if [headers][ce_id] { mutate { copy => { "[headers][ce_id]" => "[event][id]" } } }
  else if [headers][eventId] { mutate { copy => { "[headers][eventId]" => "[event][id]" } } }
  if [headers][ce_type] { mutate { copy => { "[headers][ce_type]" => "[event][type]" } } }
  else if [headers][eventType] { mutate { copy => { "[headers][eventType]" => "[event][type]" } } }
  if [headers][ce_source] { mutate { copy => { "[headers][ce_source]" => "[event][source]" } } }
  if [headers][ce_subject] { mutate { copy => { "[headers][ce_subject]" => "[event][subject]" } } }
  if [headers][outbox_original_topic] { mutate { add_field => { "[event][dead]" => "true" } } }

  if [headers][traceparent] {
    dissect {
      mapping => { "[headers][traceparent]" => "%{?version}-%{[trace][id]}-%{[span][id]}-%{?flags}" }
    }
  }

  if [headers][ce_time] {
    date { match => ["[headers][ce_time]", "ISO8601"] }
  } else if [headers][occurredAt] {
    date { match => ["[headers][occurredAt]", "ISO8601"] }
  }

  # Idempotent: redelivered records and outbox retries overwrite the same document.
  if [event][id] {
    mutate { add_field => { "[@metadata][document_id]" => "%{[kafka][topic]}:%{[event][id]}" } }
  } else {
    mutate { add_field => { "[@metadata][document_id]" => "%{[kafka][topic]}:%{[kafka][partition]}:%{[kafka][offset]}" } }
  }

  mutate { remove_field => ["[event][original]"] }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOSTS:http://elasticsearch:9200}"]
    index => "manager-events-%{+YYYY.MM}"
    document_id => "%{[@metadata][document_id]}"
    data_stream => false
    ilm_enabled => false
    manage_template => true
    template => "/usr/share/logstash/templates/manager-events.json"
    template_name => "manager-events"
    template_overwrite => true
  }
}
