services:
  mysql:
    image: mysql:8.0
    container_name: manager-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dev}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      start_period: 40s
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - manager_network

  mongodb:
    image: mongo:latest
    container_name: manager-mongodb
    restart: unless-stopped
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - manager_network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_CLIENT_PORT:-2181}
      ZOOKEEPER_TICK_TIME: ${ZOOKEEPER_TICK_TIME:-2000}
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"
    networks:
      - manager_network

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: ${KAFKA_BROKER_ID:-1}
      KAFKA_ZOOKEEPER_CONNECT: ${KAFKA_ZOOKEEPER_CONNECT:-zookeeper:2181}
      KAFKA_LISTENERS: ${KAFKA_LISTENERS:-PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092}
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS:-PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:-PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT}
      KAFKA_INTER_BROKER_LISTENER_NAME: ${KAFKA_INTER_BROKER_LISTENER_NAME:-PLAINTEXT}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:-1}
    networks:
      - manager_network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "${KAFKA_UI_PORT:-8090}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ${KAFKA_UI_CLUSTER_NAME:-local}
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_UI_BOOTSTRAP_SERVERS:-kafka:29092}
    networks:
      - manager_network

  eureka-server:
    build:
      context: .
      dockerfile: EurekaServer/Dockerfile
    image: managerv2/eureka-server:local
    container_name: eureka-server
    restart: unless-stopped
    ports:
      - "${EUREKA_PORT:-8761}:8761"
    environment:
      EUREKA_INSTANCE_HOSTNAME: ${EUREKA_INSTANCE_HOSTNAME:-eureka-server}
    networks:
      - manager_network

  manager-gateway:
    build:
      context: .
      dockerfile: Gateway/Dockerfile
    image: managerv2/gateway:local
    container_name: manager-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8088}:8088"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:-http://eureka-server:8761/eureka/}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:-true}
      SOFTWARE_CONFIGURATION_URL: ${SOFTWARE_CONFIGURATION_URL:-http://software-configuration:8081}
      RETURNING_TRACK_MANAGER_URL: ${RETURNING_TRACK_MANAGER_URL:-http://returning-manager:8070/v2/api}
      ROUTE_TRACKER_FLOW_URL: ${ROUTE_TRACKER_FLOW_URL:-http://route-tracker:8082/v2/api}
    depends_on:
      eureka-server:
        condition: service_started
      returning-manager:
        condition: service_started
      route-tracker:
        condition: service_started
    networks:
      - manager_network

  software-configuration:
    build:
      context: .
      dockerfile: SoftwareConfiguration/SoftwareConfigurationCore/Dockerfile
    image: managerv2/software-configuration:local
    container_name: software-configuration
    restart: unless-stopped
    ports:
      - "${SOFTWARE_CONFIGURATION_PORT:-8081}:8081"
    environment:
      SPRING_DATA_MONGODB_URI: ${SOFTWARE_CONFIGURATION_MONGODB_URI:-mongodb://mongodb:27017/warehouse}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:-http://eureka-server:8761/eureka/}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:-true}
    depends_on:
      mongodb:
        condition: service_started
      kafka:
        condition: service_started
      eureka-server:
        condition: service_started
    networks:
      - manager_network

  returning-manager:
    build:
      context: .
      dockerfile: ReturningTrackManager/ReturningTrackManagerImpl/Dockerfile
    image: managerv2/returning-manager:local
    container_name: returning-manager
    restart: unless-stopped
    ports:
      - "${RETURNING_MANAGER_PORT:-8070}:8070"
    environment:
      SPRING_PROFILES_ACTIVE: ${RETURNING_MANAGER_SPRING_PROFILES_ACTIVE:-dev,docker}
      SPRING_DATASOURCE_URL: ${RETURNING_MANAGER_DATASOURCE_URL:-jdbc:mysql://mysql:3306/rm}
      SPRING_DATASOURCE_USERNAME: ${RETURNING_MANAGER_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${RETURNING_MANAGER_DATASOURCE_PASSWORD:-rootpassword}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${RETURNING_MANAGER_JPA_HIBERNATE_DDL_AUTO:-update}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:-http://eureka-server:8761/eureka/}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:-true}
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_started
      kafka:
        condition: service_started
      eureka-server:
        condition: service_started
    networks:
      - manager_network

  route-tracker:
    build:
      context: .
      dockerfile: RouteTrackerFlow/RouteTrackerFlowImpl/Dockerfile
    image: managerv2/route-tracker:local
    container_name: route-tracker
    restart: unless-stopped
    ports:
      - "${ROUTE_TRACKER_PORT:-8082}:8082"
    environment:
      SPRING_DATASOURCE_URL: ${ROUTE_TRACKER_DATASOURCE_URL:-jdbc:mysql://mysql:3306/rt}
      SPRING_DATASOURCE_USERNAME: ${ROUTE_TRACKER_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${ROUTE_TRACKER_DATASOURCE_PASSWORD:-rootpassword}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:-http://eureka-server:8761/eureka/}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:-true}
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_started
      kafka:
        condition: service_started
      eureka-server:
        condition: service_started
    networks:
      - manager_network

networks:
  manager_network:
    driver: bridge

volumes:
  mysql_data:
  mongo_data:
