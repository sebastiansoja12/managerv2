server:
  port: 8071

spring:
  jackson:
    use-jackson2-defaults: true
  application:
    name: pallet-handling-manager

  modulith:
    packages: com.warehouse.pallet

  data:
    mongodb:
      uri: mongodb://localhost:27017/warehouse
      # host: localhost
      # port: 27017
      # database: your-database
      # authentication-database: admin
      # ssl: false
      # uri: mongodb+srv://<username>:<password>@cluster.mongodb.net/<database>
      # connection-minimum-idle: 10
      # connection-pool-size: 100
      # auto-index-creation: true  # U?ywaj ostro?nie w produkcji

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:pallet-handling-manager}
      auto-offset-reset: earliest

jwt:
  secret-key: ${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  issuer: ${JWT_ISSUER:manager-v2}
  audience: ${JWT_AUDIENCE:manager-v2-gui}

manager:
  kafka:
    topics:
      pallet-loaded: ${PALLET_LOADED_TOPIC:pallet.loaded}

logging:
  level:
    org.springframework.data.mongodb.core.MongoTemplate: TRACE

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
